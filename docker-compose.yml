services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: burdenoff
    ports: ['5432:5432']
    volumes: [burdenoff-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d burdenoff']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ['4000:4000']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/burdenoff
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
      PORT: '4000'
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  burdenoff-data:
